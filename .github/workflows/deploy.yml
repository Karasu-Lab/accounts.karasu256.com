name: Accounts Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v1.0.12
        with:
          mode: production
          worker-name: accounts-karasu256-com
          secret-names: INTERNAL_API_SECRET APP_ID APP_PRIVATE_KEY FIREBASE_PROJECT_ID
          vars-json: ${{ toJSON(vars) }}
          secrets-json: ${{ toJSON(secrets) }}

  preview:
    if: github.ref_name != 'main'
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v1.0.12
        with:
          mode: preview
          worker-name: accounts-karasu256-com
          secret-names: INTERNAL_API_SECRET APP_ID APP_PRIVATE_KEY FIREBASE_PROJECT_ID
          vars-json: ${{ toJSON(vars) }}
          secrets-json: ${{ toJSON(secrets) }}
