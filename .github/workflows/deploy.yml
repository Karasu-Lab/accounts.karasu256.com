name: Accounts Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Deployment itself lives in Karasu-Lab/WorkersDeploy: it deploys this
# app standalone from this repository, detects the Next.js project,
# builds it with OpenNext, and deploys it to Cloudflare Workers. This
# app does not run database migrations — they belong to the site that
# owns the database.

jobs:
  deploy:
    if: github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      APP_ID: ${{ vars.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
      STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
      STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v1
        with:
          mode: production
          worker-name: accounts-karasu256-com
          secret-names: INTERNAL_API_SECRET APP_ID APP_PRIVATE_KEY FIREBASE_PROJECT_ID
          optional-secret-names: FIREBASE_MEASUREMENT_ID STORAGE_ENDPOINT STORAGE_BUCKET STORAGE_ACCESS_KEY_ID STORAGE_SECRET_ACCESS_KEY

  preview:
    if: github.ref_name != 'main'
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      APP_ID: ${{ vars.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
      STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
      STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v1
        with:
          mode: preview
          worker-name: accounts-karasu256-com
          secret-names: INTERNAL_API_SECRET APP_ID APP_PRIVATE_KEY FIREBASE_PROJECT_ID
          optional-secret-names: FIREBASE_MEASUREMENT_ID STORAGE_ENDPOINT STORAGE_BUCKET STORAGE_ACCESS_KEY_ID STORAGE_SECRET_ACCESS_KEY
